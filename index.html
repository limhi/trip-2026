<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 親子順時針環島之旅 (6天5夜)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
    <!--
        這個檔案只負責「頁面骨架」。內容都不寫在這裡：
          行程、住宿、頁首文字 → data/trip.js
          地點電話、地址、座標  → data/places.js
          區塊長相與顏色        → js/blocks.js
          自訂樣式              → css/style.css
        data-text / data-slot 的元素會由 js/render.js 填入內容。
    -->

    <!-- Sticky Navigation -->
    <nav class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-md">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-x-2 gap-y-1">
            <div class="text-sm md:text-xl font-bold tracking-wider flex items-center gap-2 whitespace-nowrap">
                <i class="fa-solid fa-compass text-amber-400"></i>
                <span data-text="site.brand"></span>
            </div>
            <div class="flex items-center gap-2 md:gap-6 ml-auto">
                <div class="flex space-x-1 md:space-x-6 text-xs md:text-base font-bold whitespace-nowrap" data-slot="nav-links"></div>
                <!-- 版本號：內容在 data/trip.js 的 site.version -->
                <div class="shrink-0 flex flex-col md:flex-row md:gap-1.5 text-right leading-tight text-[10px] md:text-xs text-slate-400 border-l border-slate-700 pl-2 md:pl-4" aria-label="網頁版本">
                    <span class="font-bold text-slate-200" data-text="site.version.number"></span>
                    <span class="hidden md:inline" aria-hidden="true">·</span>
                    <span data-text="site.version.date"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header / Hero Section -->
    <header class="hero-bg text-white py-10 md:py-14 text-center px-4">
        <div class="max-w-3xl mx-auto">
            <span class="inline-block bg-amber-500 text-slate-950 px-3.5 py-1 rounded-full text-xs md:text-sm font-black tracking-wide mb-3 shadow" data-text="hero.dateBadge"></span>
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 leading-tight" data-text="hero.title"></h1>
            <p class="text-sm md:text-base text-slate-200 mb-6 font-medium leading-relaxed" data-text="hero.route"></p>
            <div class="inline-flex flex-wrap justify-center gap-2 text-xs md:text-sm font-bold" data-slot="hero-chips"></div>
        </div>
    </header>

    <!-- Key Rules Bar -->
    <section class="bg-amber-400 text-slate-950 py-3 font-bold text-xs md:text-sm border-b border-amber-500 shadow-inner">
        <div class="container mx-auto px-4 flex flex-wrap justify-around items-center gap-2 text-center" data-slot="highlights"></div>
    </section>

    <!-- Itinerary Section -->
    <section id="itinerary" class="py-10 md:py-16">
        <div class="container mx-auto px-3 md:px-6 max-w-4xl">
            <div class="text-center mb-8 md:mb-12">
                <span class="text-blue-600 font-extrabold text-sm tracking-wider uppercase bg-blue-50 px-3 py-1 rounded-full" data-text="itinerary.badge"></span>
                <h2 class="text-2xl md:text-4xl font-extrabold text-slate-900 mt-2" data-text="itinerary.title"></h2>
                <p class="text-slate-600 text-sm md:text-base mt-1" data-text="itinerary.subtitle"></p>
            </div>
            <div class="space-y-6 md:space-y-10" data-slot="days"></div>
        </div>
    </section>

    <!-- Hotel Section -->
    <section id="hotels" class="py-12 md:py-16 bg-slate-900 text-white border-t-4 border-emerald-500">
        <div class="container mx-auto px-4 max-w-5xl">
            <div class="text-center mb-8 md:mb-12">
                <span class="text-emerald-400 font-extrabold text-sm tracking-wider uppercase bg-emerald-950/80 border border-emerald-800 px-3.5 py-1 rounded-full" data-text="hotelsSection.badge"></span>
                <h2 class="text-2xl md:text-4xl font-extrabold text-white mt-2" data-text="hotelsSection.title"></h2>
                <p class="text-slate-300 text-sm md:text-base mt-1" data-text="hotelsSection.subtitle"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" data-slot="hotels"></div>
        </div>
    </section>

    <footer class="bg-slate-950 text-slate-500 py-6 text-center text-xs">
        <p data-text="site.footer"></p>
    </footer>

    <!-- Shared contact / navigation modal（內容由 js/modal.js 依地點資料填入） -->
    <div id="contact-modal" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4" hidden aria-hidden="true">
        <button id="contact-modal-backdrop" class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" aria-label="關閉聯絡資訊"></button>
        <section class="relative w-full sm:max-w-lg max-h-[88vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
            <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-slate-200 bg-white/95 p-5 backdrop-blur">
                <div>
                    <span id="contact-modal-type" class="text-xs font-black tracking-wider text-blue-600"></span>
                    <h2 id="contact-modal-title" class="mt-1 text-xl font-black text-slate-900"></h2>
                </div>
                <button id="contact-modal-close" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-700" aria-label="關閉">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="space-y-5 p-5">
                <div id="booking-details" class="hidden rounded-2xl border border-amber-200 bg-amber-50 p-4">
                    <h3 class="mb-2 font-black text-amber-900"><i class="fa-solid fa-user-check mr-2"></i>訂房資料</h3>
                    <p class="text-sm text-slate-700"><strong>訂房人：</strong><span id="booking-name"></span></p>
                    <p class="mt-1 text-sm text-slate-700"><strong>聯絡電話：</strong><span id="booking-phone"></span></p>
                </div>
                <div class="rounded-2xl bg-slate-50 p-4 text-sm text-slate-700">
                    <p><i class="fa-solid fa-phone mr-2 w-4 text-blue-600"></i><strong>電話：</strong><span id="contact-phone"></span></p>
                    <p class="mt-3"><i class="fa-brands fa-line mr-2 w-4 text-emerald-600"></i><strong>LINE：</strong><span id="contact-line"></span></p>
                    <p class="mt-3 flex items-start"><i class="fa-solid fa-location-dot mr-2 mt-1 w-4 shrink-0 text-rose-600"></i><span><strong>地址：</strong><span id="contact-address"></span></span></p>
                </div>
                <div id="contact-actions" class="grid grid-cols-1 gap-3 sm:grid-cols-3"></div>
                <div id="alternate-place" class="hidden rounded-2xl border border-slate-200 p-4"></div>
                <p class="text-center text-[11px] leading-relaxed text-slate-500">電話與 LINE 依業者公開資訊整理；出發前請再次確認營業狀態。</p>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- 資料（改行程只動這兩個） -->
    <script src="data/places.js"></script>
    <script src="data/trip.js"></script>
    <!-- 功能（順序不可調換） -->
    <script src="js/model.js"></script>
    <script src="js/blocks.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/map.js"></script>
    <script src="js/render.js"></script>
</body>
</html>
