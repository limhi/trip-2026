<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程編輯器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .drop-before { box-shadow: 0 -3px 0 0 #2563eb; }
    .drop-after { box-shadow: 0 3px 0 0 #2563eb; }
    .drop-end { background: #dbeafe; }
    .flash { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: #fde68a; } to { background: transparent; } }
    textarea, input, select { font: inherit; }
</style>
</head>
<body class="h-screen flex flex-col bg-slate-100 text-slate-900 text-sm">

<header class="flex items-center gap-3 bg-slate-900 px-4 py-2 text-white">
    <strong class="text-base">行程編輯器</strong>
    <span id="status" class="text-xs">載入中…</span>
    <span class="flex-1"></span>
    <button id="reload" class="rounded border border-slate-500 px-3 py-1.5 hover:bg-slate-800">重新載入</button>
    <button id="save" disabled class="rounded bg-blue-600 px-3 py-1.5 font-bold hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-40">存檔</button>
</header>
<div id="notice" role="alert" class="hidden border-b bg-rose-100 px-4 py-2 text-rose-800"></div>

<main class="grid min-h-0 flex-1 grid-cols-1 lg:grid-cols-[minmax(480px,580px)_1fr]">
    <section class="flex min-h-0 flex-col border-r bg-white">
        <nav class="flex border-b bg-slate-50 text-sm font-bold" id="tabs">
            <button data-tab="days" class="px-4 py-2">每日行程</button>
            <button data-tab="places" class="px-4 py-2">地點庫</button>
            <button data-tab="hotels" class="px-4 py-2">住宿區</button>
        </nav>
        <div id="errbar"></div>
        <div class="min-h-0 flex-1 overflow-y-auto">
            <div id="pane-days"></div>
            <div id="pane-places" class="hidden p-4 text-slate-500">地點庫編輯尚未實作。</div>
            <div id="pane-hotels" class="hidden p-4 text-slate-500">住宿區編輯尚未實作。</div>
        </div>
    </section>
    <section id="previewPane" class="hidden min-h-0 flex-col bg-slate-200 lg:flex">
        <div class="flex items-center gap-1.5 border-b bg-white px-3 py-1.5 text-xs">
            <strong>預覽</strong><span id="previewStatus" class="text-slate-500"></span><span class="flex-1"></span>
            <button data-width="phone" class="rounded border px-2.5 py-0.5 bg-slate-800 text-white">手機</button>
            <button data-width="tablet" class="rounded border px-2.5 py-0.5">平板</button>
            <button data-width="desktop" class="rounded border px-2.5 py-0.5">桌面</button>
        </div>
        <div class="flex min-h-0 flex-1 justify-center overflow-auto p-2">
            <iframe id="preview" title="預覽" class="h-full border-0 bg-white shadow" style="width:390px"></iframe>
        </div>
    </section>
</main>

<div id="toast" class="pointer-events-none fixed bottom-4 left-1/2 hidden -translate-x-1/2 rounded bg-slate-900 px-4 py-2 text-white shadow"></div>

<script src="/lib/model.js"></script>
<script src="days-logic.js"></script>
<script src="days.js"></script>
<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
