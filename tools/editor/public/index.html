<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行程編輯器</title>
<style>
    body { font: 15px/1.5 system-ui, "Noto Sans TC", sans-serif; margin: 0; background: #f6f5f1; color: #222; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
    h1 { font-size: 17px; margin: 0; }
    #status { flex: 1; color: #555; }
    button { font: inherit; padding: 5px 14px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #notice { display: none; margin: 12px 16px; padding: 10px 14px; border-radius: 6px; background: #fee2e2; color: #991b1b; }
    #notice.show { display: block; }
    #layout { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); height: calc(100vh - 53px); }
    #layout > section { min-height: 0; overflow: auto; }
    #editor { padding: 16px; }
    #previewPane { display: flex; flex-direction: column; background: #e2e8f0; border-left: 1px solid #ddd; }
    #previewBar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #fff; border-bottom: 1px solid #ddd; font-size: 13px; }
    #previewBar .spacer { flex: 1; }
    #previewBar button { padding: 2px 10px; }
    #previewBar button.on { background: #1e293b; color: #fff; }
    #previewStatus { color: #64748b; }
    #previewWrap { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 8px; overflow: auto; }
    #preview { height: 100%; width: 390px; border: 0; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
</style>
</head>
<body>
<header>
    <h1>行程編輯器</h1>
    <span id="status">載入中…</span>
    <button id="reload">重新載入</button>
    <button id="save" disabled>存檔</button>
</header>
<div id="notice" role="alert"></div>
<div id="layout">
    <section id="editor">
        <div id="main"></div>
        <p><label>預覽測試：頁首標題 <input id="heroTitle" size="24" disabled></label></p>
        <p><button data-day="1">預覽捲到第 1 天</button> <button data-day="3">第 3 天</button></p>
    </section>
    <section id="previewPane">
        <div id="previewBar">
            <strong>預覽</strong><span id="previewStatus"></span><span class="spacer"></span>
            <button data-width="phone" class="on">手機</button>
            <button data-width="tablet">平板</button>
            <button data-width="desktop">桌面</button>
        </div>
        <div id="previewWrap"><iframe id="preview" title="預覽"></iframe></div>
    </section>
</div>
<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
